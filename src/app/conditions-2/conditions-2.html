<h1> Else If | Control Flow</h1>
<button (click)="change(1)">Red</button>
<button (click)="change(2)">Green</button>
<button (click)="change(3)">Blue</button>
<button (click)="change(4)">Other</button>
<input type="text" placeholder="Enter color" (input)="handleInput($event)"/>

@if(color==1){
  <div style="width: 100px; height: 100px; background-color: red;"></div>
}
@else if (color==2) {
  <div style="width: 100px; height: 100px; background-color: green;"></div>
}
@else if (color==3) {
  <div style="width: 100px; height: 100px; background-color: blue;"></div>
}
@else {
  <div
  style="width: 100px; height: 100px; background-color: black;"></div>
}
